name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 仓库根是 d:\roche，Android/Capacitor 工程在 apk/ 下
defaults:
  run:
    working-directory: apk

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK，直接用，避免 android-actions/setup-android 在
      # ubuntu-latest 上安装 cmdline-tools 失败
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | head -n1)/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          echo "platforms:"; ls "$SDK_ROOT/platforms" || true
          echo "build-tools:"; ls "$SDK_ROOT/build-tools" || true

      - name: Install deps
        run: npm install --no-audit --no-fund --include=dev

      - name: Verify web assets
        run: |
          set -o pipefail
          if ! out=$(node check-web.mjs 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tail -n 5 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=check-web failed::$msg"
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          if [ -n "$AAPT2" ]; then "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 12; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roche-debug-apk
          path: apk/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
