name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 仓库根是 d:\roche，Android/Capacitor 工程在 apk/ 下
defaults:
  run:
    working-directory: apk

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          sdkmanager --list_installed | head -n 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Verify web assets
        run: npm run check

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roche-debug-apk
          path: apk/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
